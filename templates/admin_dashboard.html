<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperLink • Панель управления</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <h1 class="admin-title"><i class="fa-solid fa-sliders"></i> Управление HyperLink</h1>
        
        <!-- Профиль -->
        <div style="margin-bottom: 30px;">
            <h3 style="color: #4a90e2; margin-bottom: 15px;">📷 Профиль</h3>
            <form method="POST" action="/admin/update-profile">
                <div class="form-group">
                    <label>URL аватара</label>
                    <input type="text" name="avatar" class="form-control" value="{{ profile.avatar }}">
                </div>
                <div class="form-group">
                    <label>Имя артиста</label>
                    <input type="text" name="name" class="form-control" value="{{ profile.name }}">
                </div>
                <div class="form-group">
                    <label>Био</label>
                    <input type="text" name="bio" class="form-control" value="{{ profile.bio }}">
                </div>
                <button type="submit" class="btn btn-primary">💾 Сохранить профиль</button>
            </form>
        </div>
        
        <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">
        
        <!-- Платформы -->
        <div style="margin-bottom: 30px;">
            <h3 style="color: #4a90e2; margin-bottom: 15px;">🔗 Платформы и соцсети</h3>
            {% for platform in platforms %}
            <form method="POST" action="/admin/update-platform" style="margin-bottom: 10px;">
                <input type="hidden" name="platform_id" value="{{ platform.id }}">
                <div class="platform-edit">
                    <i class="{{ platform.icon }}" style="color: #4a90e2;"></i>
                    <span>{{ platform.name }}</span>
                    <input type="text" name="url" class="form-control" value="{{ platform.url }}">
                    <button type="submit" class="btn btn-primary" style="padding: 8px 16px;">OK</button>
                </div>
            </form>
            {% endfor %}
        </div>
        
        <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">
        
        <!-- Релиз -->
        <div style="margin-bottom: 30px;">
            <h3 style="color: #4a90e2; margin-bottom: 15px;">🎵 Ближайший релиз</h3>
            <form method="POST" action="/admin/update-release">
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" name="title" class="form-control" 
                           value="{{ release.title if release else '' }}">
                </div>
                <div class="form-group">
                    <label>Дата выхода</label>
                    <input type="text" name="release_date" class="form-control" 
                           value="{{ release.release_date if release else '' }}" 
                           placeholder="например, 25.12.2025">
                </div>
                <div class="form-group">
                    <label>Ссылка на pre-save</label>
                    <input type="text" name="link" class="form-control" 
                           value="{{ release.link if release else '#' }}">
                </div>
                <button type="submit" class="btn btn-primary">💾 Обновить релиз</button>
            </form>
        </div>
        
        <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">
        
        <!-- Новости -->
        <div>
            <h3 style="color: #4a90e2; margin-bottom: 15px;">📰 Новости</h3>
            
            <form method="POST" action="/admin/add-news" style="margin-bottom: 20px;">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="text" name="date" class="form-control" 
                           placeholder="25.12.2025">
                </div>
                <div class="form-group">
                    <label>Текст новости</label>
                    <textarea name="text" class="form-control" 
                              placeholder="Текст новости..."></textarea>
                </div>
                <button type="submit" class="btn btn-success">➕ Добавить новость</button>
            </form>
            
            <div>
                {% for item in news %}
                <div class="news-list-item">
                    <div>
                        <strong>{{ item.date }}</strong> — {{ item.text }}
                    </div>
                    <form method="POST" action="/admin/delete-news" style="display: inline;">
                        <input type="hidden" name="news_id" value="{{ item.id }}">
                        <button type="submit" class="btn btn-danger" style="padding: 6px 14px;">🗑️</button>
                    </form>
                </div>
                {% endfor %}
            </div>
        </div>
        
        <div style="margin-top: 30px; text-align: center;">
            <a href="/" target="_blank" class="btn btn-primary" style="text-decoration: none;">👁️ Посмотреть сайт</a>
            <a href="/admin/logout" class="btn btn-danger" style="text-decoration: none; margin-left: 10px;">🚪 Выйти</a>
        </div>
    </div>
</body>
</html>
